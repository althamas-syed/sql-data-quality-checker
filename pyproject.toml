[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-data-quality-checker"
version = "0.1.0"
description = "Open-source, read-only SQL data quality reports for SQLite databases"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
sql-quality = "sql_quality.cli:main"

[tool.setuptools.packages.find]
include = ["sql_quality*"]
